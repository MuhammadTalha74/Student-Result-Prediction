<!DOCTYPE html>
<html>

<head>

    <title>Machine Learning Assignment</title>

    <style>

        body{
            font-family: Arial;
            margin:40px;
        }

        img{
            width:500px;
            margin-top:20px;
        }

        table, th, td{
            border:1px solid black;
            border-collapse: collapse;
            padding:8px;
        }

    </style>

</head>

<body>

    <h1>Applied Machine Learning Assignment</h1>

    <form action="/upload" method="POST" enctype="multipart/form-data">

        <input type="file" name="file" required>

        <button type="submit">Upload CSV</button>

    </form>

    {% if table %}

        <h2>Dataset Preview</h2>

        {{ table|safe }}

        <h2>Linear Regression</h2>

        <p>R² Score: {{ r2 }}</p>

        <img src="{{ url_for('static', filename='plots/regression.png') }}">

        <h2>KMeans Clustering</h2>

        <img src="{{ url_for('static', filename='plots/kmeans.png') }}">

        <h2>DBSCAN Clustering</h2>

        <img src="{{ url_for('static', filename='plots/dbscan.png') }}">

    {% endif %}

</body>
</html>
